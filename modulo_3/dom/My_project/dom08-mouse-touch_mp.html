<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vete - Mouse Touch</title>
        <script src="dom08-mouse-touch_mp.js" defer></script>
    </head>
    <body>
        <h1 id="titulo">Eventos del DOM</h1>
        <h2>Zoom a la radiografia</h2>
        <div
            id="contenedorRadiografia"
            style="
                position: relative;
                width: 100%;
                height: 300px;
                margin-top: 20px;
                background: whitesmoke;
            "
        >
            <div
                id="radiografia"
                style="
                    width: 120px;
                    height: 120px;
                    background: crimson;
                    position: absolute;
                    top: 90px;
                    left: calc(50% - 60px);
                    transition: transform 0.2s ease;
                "
            ></div>
        </div>
    </body>
</html>
