<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vete - CRUD Mascotas</title>
        <script src="dom12-crud-productos_mp.js" defer></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            h2 {
                color: black;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            th,
            td {
                border: 1px solid #ddd;
                padding: 8px;
                text-align: left;
            }
            th {
                background-color: aliceblue;
            }
            tr:nth-child(even) {
                background-color: azure;
            }
            .formulario {
                background-color: aquamarine;
                border: 1px solid #b0fce8;
                padding: 20px;
                margin-top: 20px;
            }
            .formulario input {
                width: 120px;
                padding: 5px;
                margin-bottom: 8px;
            }
            .btn-agregar:hover {
                background-color: rgb(8, 104, 72);
                color: white;
            }
            .stat-card {
                display: inline-block;
                width: 200px;
                padding: 15px;
                margin: 10px;
                background-color: aquamarine;
                border: 1px solid #b0fce8;
                border-radius: 5px;
                text-align: center;
            }
            .stat-card h3 {
                margin: 0;
                color: black;
            }
        </style>
    </head>

    <body>
        <h1 id="titulo">Eventos del DOM</h1>
        <h2>CRUD de Mascotas</h2>

        <div id="status">
            <div class="stat-card">
                <h3>Total de Mascotas</h3>
                <p id="totalMascotas">0</p>
            </div>
            <div class="stat-card">
                <h3>Peso Promedio</h3>
                <p id="pesoPromedio">0</p>
            </div>
            <div class="stat-card">
                <h3>Mascota mas Pesada</h3>
                <p id="mascotaMasPesada">N/A</p>
            </div>
            <div class="stat-card">
                <h3>Mascota mas Liviana</h3>
                <p id="mascotaMasLiviana">N/A</p>
            </div>
        </div>

        <div class="formulario">
            <h3>Registrar nueva mascota</h3>
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" placeholder="Nombre de la mascota" />
            <label for="especie">Especie:</label>
            <input id="especie" type="text" placeholder="Perro, gato..." />
            <label for="peso">Peso (kg):</label>
            <input id="peso" type="number" placeholder="Peso en kg" />
            <button id="btn_agregar" class="btn-agregar">
                Agregar Mascota
            </button>
            <button id="btn_cancelar" class="btn-cancelar">Cancelar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Especie</th>
                    <th>Peso (kg)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </body>
</html>
