<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Vete - Justify Content</title>
        <link rel="stylesheet" href="09_flexbox_mp.css" />
    </head>
    <body>
        <h2>flex-start (inicio vete)</h2>
        <div class="vete-cont inicio">
            <div class="paciente">P1</div>
            <div class="paciente">P2</div>
            <div class="paciente">P3</div>
        </div>

        <h2>center (sala de espera)</h2>
        <div class="vete-cont centro">
            <div class="paciente">P1</div>
            <div class="paciente">P2</div>
            <div class="paciente">P3</div>
        </div>

        <h2>space-between (separados)</h2>
        <div class="vete-cont between">
            <div class="paciente">P1</div>
            <div class="paciente">P2</div>
            <div class="paciente">P3</div>
        </div>

        <h2>space-evenly (igualitos)</h2>
        <div class="vete-cont evenly">
            <div class="paciente">P1</div>
            <div class="paciente">P2</div>
            <div class="paciente">P3</div>
        </div>
    </body>
</html>
