<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Formulario Separadores</title>
    </head>
    <body>
        <h1>Registro con separadores</h1>
        <form action="/ingreso" method="post">
            <fieldset>
                <legend>Datos Propietario</legend>
                <label for="n">Nombre</label>
                <input type="text" id="n" name="n" />
                <label for="a">Apellido</label>
                <input type="text" id="a" name="a" />
            </fieldset>
            <br>
            <fieldset>
                <legend>Datos Mascota</legend>
                <label for="m">Mascota</label>
                <input type="text" id="m" name="m" />
                <label for="r">Raza</label>
                <input type="text" id="r" name="r" />
            </fieldset>
            <br>
            <button type="submit">Guardar</button>
        </form>
    </body>
</html>
