<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Comparativa de Planes</title>
    </head>
    <body>
        <table border="1">
            <caption>Comparativa de precios y servicios</caption>
            <colgroup>
                <col style="background-color: #eeeeee">
                <col>
                <col>
                <col>
            </colgroup>
            <thead>
                <tr>
                    <th>Servicio</th>
                    <th>Plan Basico</th>
                    <th>Plan Pro</th>
                    <th>Plan Full</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Precio</td>
                    <td>20$</td>
                    <td>40$</td>
                    <td>60$</td>
                </tr>
                <tr>
                    <td>Vacunas</td>
                    <td>No</td>
                    <td>Si</td>
                    <td>Si</td>
                </tr>
                <tr>
                    <td>Desparasitacion</td>
                    <td>Si</td>
                    <td>Si</td>
                    <td>Si</td>
                </tr>
                <tr>
                    <td>Cirugia</td>
                    <td>No</td>
                    <td>50% dto</td>
                    <td>Gratis</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>Estado</td>
                    <td>Disponible</td>
                    <td>Mas vendido</td>
                    <td>Premium</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
