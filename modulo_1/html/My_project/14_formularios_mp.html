<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Vete</title>
</head>

<body>
    <h1>Registro de Mascota</h1>

    <form action="/procesar" method="post">
        <table border="1">
            <tr>
                <td>
                    <label for="mascota">Nombre Mascota</label><br>
                    <input type="text" id="mascota" name="mascota">
                </td>
                <td>
                    <label for="duenio">Dueño</label><br>
                    <input type="text" id="duenio" name="duenio">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Correo</label><br>
                    <input type="email" id="email" name="email">
                </td>
                <td>
                    <label for="tel">Celular</label><br>
                    <input type="tel" id="tel" name="tel">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="peso">Peso kg</label><br>
                    <input type="number" id="peso" name="peso">
                </td>
                <td>
                    <label for="color">Color Collar</label><br>
                    <input type="color" id="color" name="color">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fecha">Nacimiento</label><br>
                    <input type="date" id="fecha" name="fecha">
                </td>
                <td>
                    <label for="hora">Hora Turno</label><br>
                    <input type="time" id="hora" name="hora">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="checkbox" id="vax" name="vax">
                    <label for="vax">Vacunado</label>
                </td>
                <td>
                    <fieldset>
                        <legend>Tipo</legend>
                        <input type="radio" id="p" name="t" value="p"><label>Perro</label>
                        <input type="radio" id="g" name="t" value="g"><label>Gato</label>
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="foto">Foto</label>
                    <input type="file" id="foto" name="foto">
                </td>
                <td>
                    <label for="sede">Sede</label>
                    <select id="sede" name="sede">
                        <option value="q">Quito</option>
                        <option value="s">Santo Domingo</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label>Sintomas</label><br>
                    <textarea name="s" rows="5" cols="40"></textarea>
                </td>
            </tr>
        </table>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
