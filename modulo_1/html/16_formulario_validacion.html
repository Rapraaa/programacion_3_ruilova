<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Formulario con validaciones</title>
        <meta name="description" content="" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="" />
    </head>
    <body>
        <h1>Formulario con validaciones</h1>
        <form action="/procesar" method="post">
            <fieldset>
                <legend>Campo obligatorio</legend>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required />
            </fieldset>
            <fieldset>
                <legend>Campo con rango minimo maximo</legend>
                <label for="apellido">Apellido</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    min="10"
                    max="90"
                />
            </fieldset>
            <!---Patern solo sirve ocn text o tel -->
            <fieldset>
                <legend>Patron de caracteres- expresion regular</legend>
                <label for="postal">Codigo postal</label>
                <input
                    type="text"
                    id="postal"
                    name="postal"
                    pattern="[0-9]{5}"
                />
            </fieldset>
            <fieldset>
                <legend>min max para numero</legend>
                <label for="edad">edad</label>
                <input type="number" id="edad" name="edad" min="10" max="25" />
            </fieldset>
            <fieldset>
                <legend>Solo lectura</legend>
                <label for="pais">Pais</label>
                <input
                    type="text"
                    id="pais"
                    name="pais"
                    value="Ecuador"
                    readonly
                />
            </fieldset>
            <button type="submit">enviar</button>
        </form>
    </body>
</html>
